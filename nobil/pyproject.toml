[project]
name = "nobil-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.32.3",
    "frictionless @ git+https://github.com/areleu/frictionless-py@polars-plugin" 
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["parser"]

[tool.hatch.metadata]
allow-direct-references = true
