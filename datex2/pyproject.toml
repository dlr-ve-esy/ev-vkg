[project]
name = "datex2-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cityhash>=0.4.7",
    "lxml>=5.3.0",
    "polars>=1.20.0",
]


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["parser"]

[tool.hatch.metadata]
allow-direct-references = true
