# Run configuration for the EVSE virtual knowledge graph analysis.
#
# This manifest is the single source of truth for which inputs the
# analysis runs on (audit item: "Make input and source selection
# reproducible"). Every entry records the stable dataset ID, the
# snapshot it runs on, the input file and its checksum, whether the
# dataset is part of the graph analysis, the countries it covers, and
# the reason for any exclusion. The notebook (main.py) and the extractor
# (extract_data.py) read this file instead of relying on hard-coded
# filenames or notebook checkbox state.
#
# Distinctions recorded here:
# - dataset_id is the stable identity of the assessed dataset (at.1,
#   de.1, de.2, ...). The metadata record id (sources/metadata.csv) is
#   the snapshot/assessment record id and may contain dates.
# - snapshot_date is the content date of the acquired data file. It is
#   distinct from the NAP publication/inventory date in metadata.csv.
# - The latest assessment record of a dataset (FAIR scoring) does not
#   have to be the record whose snapshot feeds the quantitative
#   analysis; both selections are recorded explicitly here.

analysis:
  name: EVSE VKG manuscript analysis
  eafo_reference:
    snapshot_id: eafo-20250617
    snapshot_date: "2025-06-17"
    meaning: >-
      EAFO AFIR target tracker and recharging point power counts export
      used as the reference for the quantitative comparison.
    inputs:
      - path: viz_data/17.06.2025-eafo-target-tracker.csv
        checksum: sha256:70bf5d99c27612dce0da121109c69ca5b44f71e332887291b04d5477f4b4fd08
      - path: viz_data/17.06.2025-eafo-power-counts.csv
